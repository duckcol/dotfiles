# tmux plugin manager
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# tmux-resurrect for tmux sessions reload after reboot system
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# restore nvim session
set -g @resurrect-strategy-nvim 'session'
#Only a conservative list of programs is restored by default:
#vi vim nvim emacs man less more tail top htop irssi weechat mutt.
#but we can add command to let it restore other
#refer to this:
#https://github.com/tmux-plugins/tmux-resurrect/blob/master/docs/restoring_programs.md
#Example restoring additional programs:
set -g @resurrect-processes 'btop "git log"'
# 启用自动启动和恢复
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
