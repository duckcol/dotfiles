# === General ===
# === 性能与兼容性优化 ===
set -s escape-time 0          # 无 Esc 延迟
set -s focus-events on        # 焦点事件
set -s extended-keys on       # 扩展键码

# === 历史与会话 ===
set -g history-limit 10000    # 滚动历史
#set -g detach-on-destroy off  # 关闭最后窗口不退出会话（保留后台）

# === 鼠标与活动监控 ===
set -g mouse on
set -g visual-activity off
setw -g monitor-activity off
setw -g monitor-bell off

# === 允许 passthrough（无害）===
set -g allow-passthrough on

# === Prefix ===
# 替换原有的阴间prefix键位Ctrl-b为Ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# === Indexing ===
# 让window和pane从1而不是0开始计数
set -g base-index 1
set -g pane-base-index 1
setw -g pane-base-index 1

# === Windows & Panes ===
bind-key c new-window -c "#{pane_current_path}"
# 将原有的%左右分割和"上下分割替换
# 注意：-v 表示垂直分割（上下）, -h 表示水平分割（左右）
bind-key '\' split-window -h -c "#{pane_current_path}"
bind-key '-' split-window -v -c "#{pane_current_path}"  
# 关闭当前窗格（带确认见下方）
bind-key x kill-pane   
# 可选：加确认（但 tmux 默认无图形确认，会直接关闭）
#bind-key x confirm-before -p "kill-pane? (y/n)" kill-pane

# === Navigation ===
# normal状态下，按Meta键（也就是Alt键）+ h/j/k/l来实现同一个window下pane的切换
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# === Resize Panes (Leader + Shift + H/J/K/L) ===
# tmux 不区分大小写键名，所以用小写 + shift 在终端中通常等效于大写
bind-key H resize-pane -L 10
bind-key J resize-pane -D 10
bind-key K resize-pane -U 10
bind-key L resize-pane -R 10
# quick layout settings
# 默认使用Prefix + space

# === Zoom Pane (Leader + z) ===
bind-key z resize-pane -Z

# 将当前的panes合并到目标windows
# alt + shift + 目标windows的数字编号
bind -n M-! join-pane -t :1
bind -n M-@ join-pane -t :2
bind -n 'M-#' join-pane -t :3
bind -n 'M-$' join-pane -t :4
bind -n M-% join-pane -t :5
bind -n M-^ join-pane -t :6
bind -n M-& join-pane -t :7
bind -n M-* join-pane -t :8
bind -n M-( join-pane -t :9

# === Window Navigation ===
# prefix 后按 n/p
bind-key n next-window
bind-key p previous-window
# 也可以用Ctrl+PageUP/PageDown
bind-key -n C-PageUp previous-window
bind-key -n C-PageDown next-window

# 快速跳转窗口 1~9
# prefix + 数字键（主用，基本不会冲突）
bind-key -r 1 select-window -t :1
bind-key -r 2 select-window -t :2
bind-key -r 3 select-window -t :3
bind-key -r 4 select-window -t :4
bind-key -r 5 select-window -t :5
bind-key -r 6 select-window -t :6
bind-key -r 7 select-window -t :7
bind-key -r 8 select-window -t :8
bind-key -r 9 select-window -t :9

# Alt + 数字键（可选，可能冲突）
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# === Copy Mode (Vi-style) ===
setw -g mode-keys vi
set -g mouse on
# Ctrl + Shift + x to enter copy mode
# instead of use Prefix + [
bind-key -n C-X copy-mode

# 进入复制模式后，用 v/y 类似 Vim，并同步到系统剪贴板
# 在按下v之后，如果想要实现vim中的Ctrl-v，可以按下r来切换
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel 'wl-copy'
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
bind-key -T copy-mode-vi Escape send-keys -X cancel

# Enable mouse control (clickable windows, panes, resizable panes)
# 使得鼠标选取文本，调整面板大小，切换面板和切换窗口
set-option -g mouse on 

# 滚动历史：Shift+PageUp/Down
bind-key -n S-PageUp copy-mode -e
bind-key -n S-PageDown send-keys -X cancel

# === Reload Config ===
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# === Look & Feel ===
set -g default-terminal "screen-256color"
set -sa terminal-overrides ",*:RGB:background@:foreground@"

# Status bar
set -g status-right "#(hostname) | #(whoami) | %H:%M %d-%b"
set -g status-right-length 50
