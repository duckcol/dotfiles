# better prefix
unbind C-b
set -g prefix C-a 
bind C-a send-prefix 
# set -g prefix2 ` #set ` as another prefix key, even use it less

# count from 1 instead of 0
set -g base-index 1
set -g pane-base-index 1

# windows create and split
bind-key c new-window -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"
bind-key '"' split-window -c "#{pane_current_path}"

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf \;
display-message -d 500 "tmux config reload.."

# Enable mouse control (clickable windows, panes, resizable panes)
# 使得鼠标选取文本，调整面板大小，切换面板和切换窗口
set-option -g mouse on 

# switch panes using Alt-arrow without prefix
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# visual mode to copy

# === Look & Feel ===

# ture color support
set -g default-terminal "${TERM}"
set -sg terminal-overrides ",*:RGB"

# status bar setting
# 状态栏右侧从左往右为： 主机名 | 用户名 | 时间
set -g status-right "#(hostname) | #(whoami) | %H:%M %d-%b"
set -g status-right-length 50
